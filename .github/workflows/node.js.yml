name: Frontend CI/CD with NCP

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Debug Secrets
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.NCP_ACCESS_KEY }}";
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.NCP_SECRET_KEY }}";

      - name: Upload to NCP Object Storage
        # uses: jakejarvis/s3-sync-action@master
        uses: jakejarvis/s3-sync-action@v0.5.0
        with:
          args: --acl public-read --follow-symlinks
        env:
          AWS_S3_BUCKET: ${{ secrets.NCP_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.NCP_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NCP_SECRET_KEY }}
          AWS_ENDPOINT_URL: 'https://kr.object.ncloudstorage.com'
          SOURCE_DIR: 'dist' # 빌드된 디렉토리 (Vite, React 등 빌드 결과물 경로)
